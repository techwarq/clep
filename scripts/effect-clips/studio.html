<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Public+Sans:wght@400;500;600;700&display=block" rel="stylesheet" />
<style>
  :root { --ink:#171512; --soft:#6f6a61; --hair:#ece8e1; --orange:#ff6a3d; --cream:#f6efdf; --green:#1f9d5b; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1280px; height: 720px; overflow: hidden; background: var(--cream); }
  body { font-family: "Public Sans", system-ui, sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
  .mono { font-family: "IBM Plex Mono", ui-monospace, monospace; }
  #stage { position: absolute; inset: 0; overflow: hidden; }
  #bg, #bg > div { position: absolute; inset: 0; }
  #cam { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; transform-origin: 0 0; }
  #hud { position: absolute; inset: 0; pointer-events: none; }
  .warm { background: radial-gradient(120% 90% at 15% 10%, #ffd2b8 0%, transparent 55%), radial-gradient(90% 80% at 90% 90%, #ffc39e 0%, transparent 60%), linear-gradient(135deg, #f8e7d2, #f3dcc2); }

  /* window */
  .win { position: absolute; background: #fff; border-radius: 14px; overflow: hidden;
         box-shadow: 0 40px 90px -30px rgba(80,40,10,.38), 0 0 0 1px rgba(23,21,18,.07); }
  .bar { height: 38px; display: flex; align-items: center; gap: 7px; padding: 0 14px; background: #f8f6f2; border-bottom: 1px solid var(--hair); position: relative; }
  .bar i { width: 11px; height: 11px; border-radius: 50%; }
  .bar i:nth-child(1) { background: #ff5f57; } .bar i:nth-child(2) { background: #febc2e; } .bar i:nth-child(3) { background: #28c840; }
  .url { position: absolute; left: 50%; transform: translateX(-50%); font: 12px "IBM Plex Mono", monospace; color: #8a847a; background: #fff; padding: 4px 16px; border-radius: 7px; border: 1px solid var(--hair); white-space: nowrap; }
  .body { position: absolute; top: 38px; left: 0; right: 0; bottom: 0; overflow: hidden; }

  /* app pieces */
  .side { position: absolute; left: 0; top: 0; bottom: 0; width: 196px; border-right: 1px solid var(--hair); padding: 22px 14px; background: #fcfbf9; }
  .logo { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 15px; margin: 0 8px 22px; }
  .logo b { width: 20px; height: 20px; border-radius: 6px; background: var(--ink); }
  .nav { padding: 8px 10px; border-radius: 8px; font-size: 13.5px; color: var(--soft); margin-bottom: 2px; }
  .nav.on { background: #f1ede6; color: var(--ink); font-weight: 600; }
  .main { position: absolute; left: 196px; right: 0; top: 0; bottom: 0; padding: 30px 36px; }
  h1 { font-size: 24px; font-weight: 700; letter-spacing: -0.02em; }
  .sub { margin-top: 4px; font-size: 13.5px; color: var(--soft); }
  .head { display: flex; justify-content: space-between; align-items: flex-start; }
  .btn { display: inline-flex; align-items: center; gap: 8px; border: 0; background: var(--orange); color: #fff; font: 600 14px "Public Sans", sans-serif; padding: 11px 18px; border-radius: 10px; white-space: nowrap; }
  .btn.dark { background: var(--ink); }
  .btn.ghost { background: #f3f0ea; color: var(--ink); }
  .chip { display: inline-block; padding: 6px 12px; border: 1px solid var(--hair); border-radius: 999px; font-size: 12.5px; color: var(--soft); margin-right: 6px; }
  .spin { width: 14px; height: 14px; border-radius: 50%; border: 2px solid rgba(255,255,255,.4); border-top-color: #fff; }
  .spin.dark { border-color: rgba(23,21,18,.15); border-top-color: var(--ink); }
  .row { display: flex; align-items: center; gap: 14px; padding: 13px 4px; border-bottom: 1px solid var(--hair); }
  .av { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; font-weight: 700; font-size: 14px; color: #fff; }
  .row .nm { font-weight: 600; font-size: 14.5px; } .row .mt { font-size: 12.5px; color: var(--soft); }
  .score { margin-left: auto; font: 500 12.5px "IBM Plex Mono", monospace; padding: 4px 10px; border-radius: 999px; background: #fff1eb; color: #c2441c; }
  .card { position: absolute; border: 1px solid var(--hair); border-radius: 14px; background: #fff; padding: 20px; }
  .bars { display: flex; align-items: flex-end; gap: 8px; }
  .bars span { flex: 1; border-radius: 5px 5px 2px 2px; background: var(--orange); }
  .prog { height: 8px; border-radius: 99px; background: #f1ede6; overflow: hidden; }
  .prog > div { height: 100%; background: var(--orange); border-radius: 99px; width: 0; }
  .line { height: 10px; border-radius: 5px; background: #ece8e1; margin-bottom: 10px; }

  /* cursor + fx */
  #cursor { position: absolute; left: 0; top: 0; width: 26px; height: 34px; margin: -3px 0 0 -4px; transform-origin: 4px 3px; z-index: 50; filter: drop-shadow(0 3px 5px rgba(0,0,0,.28)); }
  .trail { position: absolute; width: 26px; height: 34px; margin: -3px 0 0 -4px; z-index: 49; }
  .ripple { position: absolute; width: 60px; height: 60px; margin: -30px 0 0 -30px; border-radius: 50%; border: 3px solid var(--orange); background: rgba(255,106,61,.18); z-index: 48; }

  /* hud */
  .pill { position: absolute; font: 500 14px "IBM Plex Mono", monospace; padding: 8px 14px; border-radius: 999px; background: rgba(23,21,18,.86); color: #fff; white-space: nowrap; }
  .pill em { font-style: normal; color: var(--orange); }
  .key { display: inline-grid; place-items: center; min-width: 52px; height: 52px; padding: 0 14px; margin: 0 5px; border-radius: 12px; background: rgba(23,21,18,.88); color: #fff; font: 600 24px "Public Sans", sans-serif; box-shadow: 0 4px 0 rgba(0,0,0,.35); }
</style>
</head>
<body>
<div id="stage">
  <div id="bg"></div>
  <div id="cam"><div id="world"></div><div id="fx"></div>
    <svg id="cursor" viewBox="0 0 26 34"><path d="M3 2 L3 26 L9.5 20 L14 30.5 L18.2 28.6 L13.8 18.6 L22.5 18.6 Z" fill="#171512" stroke="#fff" stroke-width="2.2" stroke-linejoin="round"/></svg>
  </div>
  <div id="hud"></div>
</div>
<script>
// ---------- helpers ----------
const W = 1280, H = 720;
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const out = (x) => 1 - Math.pow(1 - x, 3);
const lerp = (a, b, p) => a + (b - a) * p;
const prog = (t, a, b, e = ease) => e(clamp((t - a) / (b - a)));
const fade = (t, a, b, c, d) => prog(t, a, b) * (1 - prog(t, c, d));   // in a→b, out c→d
function track(t, keys) {
  if (t <= keys[0][0]) return keys[0][1];
  for (let i = 1; i < keys.length; i++) {
    if (t <= keys[i][0]) {
      const [t0, v0] = keys[i - 1], [t1, v1] = keys[i];
      const p = ease((t - t0) / (t1 - t0));
      return Array.isArray(v0) ? v0.map((x, j) => lerp(x, v1[j], p)) : lerp(v0, v1, p);
    }
  }
  return keys[keys.length - 1][1];
}
function R(el) { const r = el.getBoundingClientRect(); return { x: r.left + r.width / 2, y: r.top + r.height / 2, l: r.left, t: r.top, r: r.right, b: r.bottom, w: r.width, h: r.height }; }
function seeded(seed) { return () => ((seed = (seed * 16807) % 2147483647) - 1) / 2147483646; }
function makeWindow(world, { x = 100, y = 60, w = 1080, h = 600, url = "acme.app" } = {}) {
  const el = document.createElement("div");
  el.className = "win";
  Object.assign(el.style, { left: x + "px", top: y + "px", width: w + "px", height: h + "px" });
  el.innerHTML = `<div class="bar"><i></i><i></i><i></i><span class="url">${url}</span></div><div class="body"></div>`;
  world.appendChild(el);
  return el.querySelector(".body");
}
const side = (items, on) => `<div class="side"><div class="logo"><b></b>Acme</div>${items.map((n, i) => `<div class="nav ${i === on ? "on" : ""}">${n}</div>`).join("")}</div>`;
const HOME = [1, 640, 360];
const typed = (s, t, a, b) => s.slice(0, Math.round(s.length * clamp((t - a) / (b - a))));
const caret = (on) => `<span style="display:inline-block;width:2px;height:1.1em;vertical-align:-0.18em;background:var(--orange);margin-left:1px;opacity:${on ? 1 : 0}"></span>`;

// ---------- scenes ----------
// Each scene: dur, poster, setup(world, hud) -> ctx, cam(t) -> [scale, fx, fy], cursor(t) -> [x, y] | null, clicks: [{t, x, y}], render(t, ctx)
const S = {};

/* 1. Zoom-ins */
S["effect-zoom"] = {
  dur: 5, poster: 2.9,
  setup(world) {
    const b = makeWindow(world, { url: "acme.app/leads" });
    const leads = [["N", "Northwind", "Fintech · 84 people", 92, "#ff6a3d"], ["L", "Lumen Pay", "Payments · 51 people", 88, "#3b82f6"], ["H", "Harbor", "Lending · 120 people", 81, "#16a34a"], ["K", "Kite Ledger", "Accounting · 37 people", 77, "#a855f7"], ["T", "Tallyhub", "Treasury · 64 people", 74, "#eab308"], ["O", "Orbital", "Banking API · 98 people", 70, "#0ea5e9"]];
    b.innerHTML = side(["Overview", "Leads", "Reports", "Settings"], 1) + `<div class="main">
      <div class="head"><div><h1>Leads</h1><p class="sub">Companies that match your ideal customer.</p></div>
      <button class="btn" id="go"><span id="golbl">Find leads</span></button></div>
      <div style="margin:20px 0 6px"><span class="chip">Series A–B</span><span class="chip">Fintech</span><span class="chip">US + EU</span></div>
      <div id="rows">${leads.map(([a, n, m, s, c]) => `<div class="row"><div class="av" style="background:${c}">${a}</div><div><div class="nm">${n}</div><div class="mt">${m}</div></div><span class="score">${s} fit</span></div>`).join("")}</div></div>`;
    const btn = R($("#go")), rows = $$("#rows .row").map(R);
    this.clicks = [{ t: 1.75, x: btn.x, y: btn.y }];
    this.camKeys = [[0, HOME], [0.6, HOME], [1.45, [2.0, btn.x - 90, btn.y + 40]], [2.15, [2.0, btn.x - 90, btn.y + 40]], [2.75, [1.65, rows[1].x - 120, rows[1].y]], [3.7, [1.65, rows[1].x - 120, rows[4].y]], [4.2, [1.65, rows[1].x - 120, rows[4].y]], [4.9, HOME]];
    this.curKeys = [[0, [720, 610]], [0.45, [720, 610]], [1.6, [btn.x - 6, btn.y + 2]], [2.3, [btn.x - 6, btn.y + 2]], [3.2, [btn.x - 160, rows[3].y + 30]], [4.3, [btn.x - 160, rows[3].y + 30]], [5, [720, 610]]];
    return { rows: $$("#rows .row"), lbl: $("#golbl") };
  },
  cam(t) { return track(t, this.camKeys); },
  cursor(t) { return track(t, this.curKeys); },
  render(t, c) {
    const finding = t > 1.75 && t < 3.4;
    c.lbl.innerHTML = finding ? `<span style="display:inline-flex;gap:8px;align-items:center"><span class="spin" style="transform:rotate(${t * 720}deg)"></span>Finding…</span>` : t >= 3.4 && t < 4.7 ? "Found 6" : "Find leads";
    const gone = 1 - prog(t, 4.5, 4.95);
    c.rows.forEach((r, i) => { const p = prog(t, 2.1 + i * 0.22, 2.45 + i * 0.22, out); r.style.opacity = p * gone; r.style.transform = `translateY(${(1 - p) * 14}px)`; });
  },
};

/* 2. Typing */
S["effect-typing"] = {
  dur: 5, poster: 2.6,
  text: "Churn by plan, last 90 days",
  setup(world) {
    const b = makeWindow(world, { url: "acme.app/ask" });
    b.innerHTML = side(["Ask", "Dashboards", "Reports", "Settings"], 0) + `<div class="main" style="display:flex;flex-direction:column;align-items:center;padding-top:120px">
      <h1 style="font-size:30px">What should we look into?</h1><p class="sub" style="margin-top:8px">Ask a question about your product data.</p>
      <div id="box" style="margin-top:30px;width:640px;height:62px;border:1.5px solid var(--hair);border-radius:14px;display:flex;align-items:center;padding:0 10px 0 20px;box-shadow:0 8px 30px -14px rgba(0,0,0,.18)">
        <div style="flex:1;font-size:19px;white-space:nowrap;overflow:hidden"><span id="ph" style="color:#b3ada3;position:absolute">Ask Acme…</span><span id="txt"></span><span id="car"></span></div>
        <button class="btn" id="send" style="padding:10px 14px">Ask ↵</button></div>
      <div style="margin-top:20px"><span class="chip">Weekly actives</span><span class="chip">Top referrers</span><span class="chip">Trial → paid</span></div></div>`;
    const box = R($("#box")), send = R($("#send"));
    this.box = box;
    this.clicks = [{ t: 3.75, x: send.x, y: send.y }];
    return { txt: $("#txt"), ph: $("#ph"), car: $("#car"), boxEl: $("#box"), send: $("#send") };
  },
  cam(t) {
    const b = this.box, s = track(t, [[0, 1], [0.35, 1], [1.05, 2.15], [3.9, 2.15], [4.7, 1]]);
    const w = this._w || 0, cx = clamp(b.l + 20 + w + 60, b.l + 300, b.r - 290);
    const fx = lerp(640, cx, prog(t, 0.35, 1.05) * (1 - prog(t, 3.9, 4.7)));
    return [s, fx, lerp(360, b.y, prog(t, 0.35, 1.05) * (1 - prog(t, 3.9, 4.7)))];
  },
  cursor() { return null; },
  render(t, c) {
    const s = t < 4.6 ? typed(this.text, t, 1.1, 3.3) : "";
    c.txt.textContent = s;
    c.ph.style.opacity = s ? 0 : 1;
    c.car.innerHTML = caret(t > 0.9 && t < 3.75 && (t > 1.1 && t < 3.3 ? true : Math.floor(t * 2.5) % 2 === 0));
    this._w = c.txt.offsetWidth;
    c.boxEl.style.borderColor = t > 0.9 && t < 4.2 ? "var(--orange)" : "var(--hair)";
    c.send.style.transform = `scale(${t > 3.72 && t < 3.86 ? 0.93 : 1})`;
  },
  speed(t) { return t > 1.05 && t < 3.35 ? ["1.7x", fade(t, 1.0, 1.2, 3.2, 3.4)] : null; },
};

/* 3. Clicks & uploads */
S["effect-click-upload"] = {
  dur: 5.5, poster: 3.0,
  setup(world) {
    const b = makeWindow(world, { url: "acme.app/convert" });
    b.innerHTML = `<div class="side"><div class="logo"><b></b>Acme</div><div class="sub" style="margin:0 8px 10px;font-size:11px;letter-spacing:.06em;text-transform:uppercase">Recent files</div>
      <div class="nav" id="file" style="display:flex;gap:9px;align-items:center;color:var(--ink)"><span style="width:22px;height:26px;border-radius:4px;background:#e5484d;color:#fff;font:700 8px sans-serif;display:grid;place-items:center">PDF</span>q3-report.pdf</div>
      <div class="nav" style="display:flex;gap:9px;align-items:center"><span style="width:22px;height:26px;border-radius:4px;background:#d6d1c8"></span>notes.docx</div>
      <div class="nav" style="display:flex;gap:9px;align-items:center"><span style="width:22px;height:26px;border-radius:4px;background:#d6d1c8"></span>deck.key</div></div>
      <div class="main"><h1>Convert to Markdown</h1><p class="sub">PDF, Word or slides in. Clean markdown out.</p>
      <div id="dz" style="margin-top:28px;height:330px;border:2px dashed #dcd6cc;border-radius:16px;display:grid;place-items:center;text-align:center;position:relative">
        <div id="dzIdle"><div style="font-size:34px">⇣</div><div style="font-weight:600;margin-top:6px">Drop a file here</div><div class="sub">up to 50 MB</div></div>
        <div id="dzWork" style="position:absolute;width:440px;text-align:left">
          <div style="display:flex;gap:12px;align-items:center"><span id="ico" style="width:36px;height:42px;border-radius:6px;background:#e5484d;color:#fff;font:700 10px sans-serif;display:grid;place-items:center">PDF</span>
          <div style="flex:1"><div id="fname" style="font-weight:600">q3-report.pdf</div><div class="sub" id="fstat">Converting…</div></div><span id="chk" style="font-size:22px;color:var(--green)">✓</span></div>
          <div class="prog" style="margin-top:16px"><div id="bar"></div></div></div></div></div>`;
    const file = R($("#file")), dz = R($("#dz"));
    this.dz = dz;
    this.clicks = [{ t: 0.85, x: file.x - 40, y: file.y }, { t: 2.0, x: dz.x, y: dz.y }];
    this.camKeys = [[0, HOME], [1.2, HOME], [2.0, [1.55, dz.x, dz.y]], [4.5, [1.55, dz.x, dz.y]], [5.2, HOME]];
    this.curKeys = [[0, [700, 600]], [0.8, [file.x - 40, file.y]], [0.9, [file.x - 40, file.y]], [1.95, [dz.x, dz.y]], [2.9, [dz.x + 120, dz.y + 110]], [4.6, [dz.x + 120, dz.y + 110]], [5.5, [700, 600]]];
    const chip = document.createElement("div");
    chip.innerHTML = `<div style="display:flex;gap:8px;align-items:center;background:#fff;border-radius:10px;padding:8px 12px;box-shadow:0 12px 30px -8px rgba(0,0,0,.3);font-size:13px;font-weight:600"><span style="width:18px;height:22px;border-radius:3px;background:#e5484d"></span>q3-report.pdf</div>`;
    Object.assign(chip.style, { position: "absolute", zIndex: 40 });
    $("#fx").appendChild(chip);
    return { chip, idle: $("#dzIdle"), work: $("#dzWork"), bar: $("#bar"), stat: $("#fstat"), fname: $("#fname"), ico: $("#ico"), chk: $("#chk"), dzEl: $("#dz") };
  },
  cam(t) { return track(t, this.camKeys); },
  cursor(t) { return track(t, this.curKeys); },
  render(t, c) {
    const drag = t > 0.88 && t < 2.0, [x, y] = this.cursor(t);
    c.chip.style.opacity = drag ? 1 : 0;
    c.chip.style.transform = `translate(${x + 14}px, ${y + 16}px) rotate(-4deg)`;
    const over = t > 1.55 && t < 2.1;
    c.dzEl.style.borderColor = over ? "var(--orange)" : "#dcd6cc";
    c.dzEl.style.background = over ? "#fff6f2" : "transparent";
    const working = t >= 2.0 && t < 5.15;
    c.idle.style.opacity = working ? 0 : 1;
    c.work.style.opacity = working ? prog(t, 2.0, 2.2) * (1 - prog(t, 4.95, 5.15)) : 0;
    const p = prog(t, 2.15, 3.75, (x) => x);
    c.bar.style.width = p * 100 + "%";
    const done = t > 3.8;
    c.stat.textContent = done ? "14 pages · 3 tables · 0.9 s" : `Converting… ${Math.round(p * 100)}%`;
    c.fname.textContent = done ? "q3-report.md" : "q3-report.pdf";
    c.ico.style.background = done ? "var(--ink)" : "#e5484d";
    c.ico.textContent = done ? "MD" : "PDF";
    c.chk.style.opacity = done ? prog(t, 3.8, 4.0) : 0;
    c.bar.style.background = done ? "var(--green)" : "var(--orange)";
  },
  speed(t) { return t > 2.1 && t < 3.8 ? ["2x", fade(t, 2.1, 2.3, 3.6, 3.8)] : null; },
};

/* 4. Multi-step flows */
S["effect-multistep"] = {
  dur: 6, poster: 3.4,
  steps: [["Install", "$ npm i @acme/cli", "added 1 package in 2s"], ["Trace", "Recording the session", "38 events captured"], ["Run", "Replaying 18 checks", "18 of 18 passed"], ["Report", "Building the summary", "Report ready · 3 charts"]],
  at(i) { return 0.2 + 1.3 * i; },
  setup(world) {
    const b = makeWindow(world, { url: "acme.app/pipeline" });
    const cw = 480, ch = 220, pos = [[40, 86], [540, 86], [40, 326], [540, 326]];
    b.innerHTML = `<div style="padding:28px 40px"><h1>Release pipeline</h1><p class="sub">Four steps, one take.</p></div>` + this.steps.map(([n, a], i) => `
      <div class="card" style="left:${pos[i][0]}px;top:${pos[i][1]}px;width:${cw}px;height:${ch}px">
        <div style="display:flex;align-items:center;gap:10px"><span class="mono" style="color:var(--orange);font-size:13px">0${i + 1}</span><b style="font-size:18px">${n}</b>
        <span class="st" style="margin-left:auto;font-size:13px;color:var(--soft)">Pending</span></div>
        <div class="mono ln" style="margin-top:22px;font-size:14px;color:var(--soft)">${a}</div>
        <div class="prog" style="margin-top:22px"><div></div></div>
        <button class="btn ghost run" style="margin-top:22px;padding:9px 16px;font-size:13px">Run step</button></div>`).join("");
    const cards = $$(".card", b), runs = $$(".run", b).map(R), cr = cards.map(R);
    this.clicks = runs.map((r, i) => ({ t: this.at(i) + 0.45, x: r.x, y: r.y }));
    const cam = [[0, HOME]];
    cr.forEach((r, i) => { cam.push([this.at(i) + 0.3, [1.8, r.x + 30, r.y]], [this.at(i) + 1.05, [1.8, r.x + 30, r.y]]); });
    cam.push([this.at(3) + 1.2, [1.8, cr[3].x + 30, cr[3].y]], [5.6, HOME]);
    this.camKeys = cam;
    const cur = [[0, [640, 640]]];
    runs.forEach((r, i) => { cur.push([this.at(i) + 0.4, [r.x - 4, r.y + 2]], [this.at(i) + 0.75, [r.x - 4, r.y + 2]]); });
    cur.push([5.8, [640, 640]]);
    this.curKeys = cur;
    return { cards };
  },
  cam(t) { return track(t, this.camKeys); },
  cursor(t) { return track(t, this.curKeys); },
  render(t, c) {
    c.cards.forEach((card, i) => {
      const a = this.at(i) + 0.45, p = prog(t, a, a + 0.65, (x) => x), done = t > a + 0.65, run = t > a && !done;
      const st = $(".st", card);

// ---------- engine ----------
const name = new URLSearchParams(location.search).get("scene");
const scene = S[name];
let ctx;
const view = (c) => { const [s, fx, fy] = c; const hw = W / 2 / s, hh = H / 2 / s; return [s, clamp(fx, hw, W - hw), clamp(fy, hh, H - hh)]; };

function renderAt(t) {
  t = Math.min(t, scene.dur - 1e-6);
  scene.render(t, ctx);
  const [s, fx, fy] = view(scene.cam(t));
  const [s0, fx0, fy0] = view(scene.cam(Math.max(0, t - 1 / 30)));
  const v = Math.hypot((fx - fx0) * s, (fy - fy0) * s) + Math.abs(s - s0) * 900;
  const cam = $("#cam");
  cam.style.transform = `translate(${W / 2}px,${H / 2}px) scale(${s}) translate(${-fx}px,${-fy}px)`;
  cam.style.filter = v > 10 ? `blur(${Math.min(0.8, (v - 10) * 0.03)}px)` : "none";   // motion blur on fast moves

  const cur = $("#cursor"), p = scene.cursor(t);
  cur.style.display = p ? "block" : "none";
  if (p) {
    const down = (scene.clicks || []).some((k) => t >= k.t - 0.05 && t < k.t + 0.12);
    cur.style.transform = `translate(${p[0]}px,${p[1]}px) scale(${(down ? 0.82 : 1) / Math.sqrt(s)})`;
  }
  $$(".ripple").forEach((r) => r.remove());
  for (const k of scene.clicks || []) {
    const u = (t - k.t) / 0.55;
    if (u < 0 || u > 1) continue;
    const r = document.createElement("div");
    r.className = "ripple";
    Object.assign(r.style, { left: k.x + "px", top: k.y + "px", transform: `scale(${0.3 + out(u) * 1.1})`, opacity: 1 - u });
    $("#fx").appendChild(r);
  }

  // hud chips
  let hud = "";
  const sp = scene.speed && scene.speed(t);
  if (sp) hud += `<div class="pill" style="right:28px;top:22px;opacity:${sp[1]}"><em>▶▶</em> ${sp[0]}</div>`;
  const tag = scene.tag && scene.tag(t);
  if (tag) hud += `<div class="pill" style="left:28px;top:22px;opacity:${tag[1]}"><em>§</em> ${tag[0]}</div>`;
  if (scene.ratio) hud += `<div class="pill" style="right:28px;top:22px">${scene.ratio(t)}</div>`;
  if (scene.label) { const [l, o] = scene.label(t); hud += `<div class="pill" style="left:50%;bottom:20px;transform:translateX(-50%);opacity:${o}">${l}</div>`; }
  if (scene.legend) hud += `<div class="pill" style="left:28px;bottom:22px;background:rgba(255,255,255,.88);color:var(--ink)"><span style="color:#9a8f80">- - -</span> your mouse &nbsp; <em>━━</em> Clep's cursor</div>`;
  let chips = $("#chips");
  if (!chips) { chips = document.createElement("div"); chips.id = "chips"; $("#hud").appendChild(chips); }
  chips.innerHTML = hud;
}

(async () => {
  ctx = scene.setup($("#world"), $("#hud"));
  if (!$("#bg").children.length) $("#bg").className = "warm";
  await document.fonts.ready;
  renderAt(0);
  window.DUR = scene.dur; window.POSTER = scene.poster; window.READY = true;
})();
</script>
